# k8s-networkpolicy.yaml — egress-only политика для воркера KAI9000.
# Применение: APPLY_POLICY=1 ./cluster-checks.sh
#
# Разрешаем ровно три направления: Redis, KFP, K8s API (+ DNS).
# Всё остальное режется.
#
# ВАЖНО: ниже стоит ПЛЕЙСХОЛДЕР __KUBE_API_CIDR__/32, а не рабочий IP.
# Сырой `kubectl apply -f k8s-networkpolicy.yaml` ОТКАЖЕТСЯ работать —
# это защита от молчаливого отрезания API-сервера, а не баг.
#
# Реальный Service CIDR зависит от кластера:
#   kubeadm: 10.96.0.0/12   RKE2/K3s: 10.43.0.0/16
#   EKS:     172.20.0.0/16  GKE/AKS:  свои диапазоны
# Получи свой IP:
#   kubectl get svc kubernetes -n default -o jsonpath='{.spec.clusterIP}'
# и замени __KUBE_API_CIDR__ на этот IP (или доверь cluster-checks.sh
# при APPLY_POLICY=1 — скрипт подставит автоматически).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kai9000-worker-egress
  namespace: ml-system
spec:
  podSelector:
    matchLabels:
      app: kai9000-worker
  policyTypes:
    - Ingress
    - Egress
  ingress: []          # воркер не принимает входящих
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ml-pipeline
          podSelector:
            matchLabels:
              app: ml-pipeline
      ports:
        - protocol: TCP
          port: 8888
    - to:
        - ipBlock:
            # ЗАМЕНИТЬ НА РЕАЛЬНЫЙ IP API-сервера (см. заголовок файла).
            cidr: __KUBE_API_CIDR__/32
      ports:
        - protocol: TCP
          port: 443
