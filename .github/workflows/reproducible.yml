name: reproducible

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fix gradlew permissions
        run: chmod +x gradlew
      - name: Fetch llama.cpp (if needed for audit)
        run: bash scripts/fetch_llama.sh || true
      - name: Proprietary-dependency audit
        run: SKIP_GRADLE_AUDIT=1 bash scripts/check_no_proprietary.sh

  unit-tests:
    runs-on: ubuntu-24.04
    needs: audit
    steps:
      - uses: actions/checkout@v4
      - name: Fix gradlew permissions
        run: chmod +x gradlew
      - name: Fetch llama.cpp
        run: bash scripts/fetch_llama.sh
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Runtime classpath audit
        run: bash scripts/check_no_proprietary.sh
      - run: ./gradlew --no-daemon :app:testReleaseUnitTest

  build-twice:
    runs-on: ubuntu-24.04
    needs: unit-tests
    env:
      SOURCE_DATE_EPOCH: "1700000000"
      TZ: UTC
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - name: Fix gradlew permissions
        run: chmod +x gradlew
      - name: Fetch llama.cpp (CRITICAL FIX)
        run: bash scripts/fetch_llama.sh
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install NDK, CMake and accept licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "ndk;27.2.12479018" \
            "cmake;3.22.1" \
            "build-tools;35.0.0" \
            "platforms;android-35"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      
      - name: Build #1
        run: ./gradlew --no-daemon --no-build-cache clean :app:assembleRelease
      - run: sha256sum app/build/outputs/apk/release/*.apk | tee build1.sha256
      
      - name: Build #2 (clean, same path)
        run: ./gradlew --no-daemon --no-build-cache clean :app:assembleRelease
      - run: sha256sum app/build/outputs/apk/release/*.apk | tee build2.sha256
      
      - name: Compare
        run: |
          if diff <(cut -d' ' -f1 build1.sha256) <(cut -d' ' -f1 build2.sha256); then
            echo "REPRODUCIBLE: identical APK hashes"
          else
            echo "NOT reproducible"; exit 1
          fi
      
      - uses: actions/upload-artifact@v4
        with:
          name: apk-release-unsigned
          path: app/build/outputs/apk/release/*.apk
