# Heap for Gradle JVM. Sandbox has 2 GB RAM: keep it small, single worker, no separate daemon.
org.gradle.jvmargs=-Xmx1200m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=false
android.useAndroidX=true
kotlin.code.style=official
# Kotlin compiles inside the Gradle JVM (no extra daemon process)
kotlin.compiler.execution.strategy=in-process
# Reproducible builds: no VCS info, no build-time ids in the APK
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=true
