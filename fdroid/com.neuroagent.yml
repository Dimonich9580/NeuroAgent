AutoName: NeuroAgent
Summary: On-device and cloud AI agent that controls the phone
Description: |
    NeuroAgent is an autonomous AI agent for Android. It sends your request to an
    OpenAI-compatible API (or a local GGUF model via llama.cpp) and lets the model use
    tools: read the screen (AccessibilityService), tap and type, run shell commands,
    and run privileged commands through Shizuku. Every capability is off by default and
    can be enabled in Settings.

    Dependencies are FOSS only. No Google Mobile Services, no analytics.

